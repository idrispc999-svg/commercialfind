services:
  - type: web
    name: commercialfind
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COMMERCIALFIND_PORT
        value: "10000"
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: YTDLP_PATH
        value: /usr/local/bin/yt-dlp
